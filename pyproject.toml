[project]
name = "jev-calibration"
version = "0.1.0"
description = "Label priors under zero evidence in a calibration-trained decision model (TypeSafe Jev)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# A verbatim third-party script with a device-only patch; keep it diffable against upstream.
extend-exclude = ["src/jevcal/eve_patch/eve_train_sft_mps.py"]
